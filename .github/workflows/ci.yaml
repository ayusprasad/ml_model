name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Validate Repository Hygiene & Python Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Hygiene
        run: |
          python -c "import os; assert not os.path.exists('.venv'), 'Virtualenv should not be tracked!'"
